<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brawl Portal</title><style>
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle,#25252b,#050507 70%);color:white;font-family:Arial,sans-serif;min-height:100vh;padding-bottom:125px}
button,input,select{font:inherit}
button{cursor:pointer}
.wrap{width:min(1100px,94%);margin:auto}
.title{text-align:center;font-size:clamp(45px,9vw,100px);font-weight:1000;text-shadow:0 6px #000;margin:15px 0 28px}
.title span{color:#f3d234}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px}
.card{border:0;border-radius:30px;min-height:245px;color:white;box-shadow:0 12px 0 #0005;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:20px;text-align:center;overflow:hidden}
.card h2{font-size:clamp(30px,6vw,65px);margin:0;font-weight:1000;text-shadow:0 4px #0003}
.icon{font-size:clamp(70px,10vw,125px)}
.card.big-icon .icon{font-size:clamp(110px,20vw,220px)}
.scripts{background:linear-gradient(135deg,#42dcd6,#0bb6bf)}
.magic{background:linear-gradient(135deg,#ffb81a,#e90b7b,#6840f5)}
.maps{background:linear-gradient(135deg,#26c281,#087f8c)}
.official{background:linear-gradient(135deg,#f21d2a,#6b25d5,#19aee7)}
.tnt{background:linear-gradient(135deg,#ff1717,#8f0000)}
.hebrew{background:linear-gradient(135deg,#ffb719,#d20b82,#7044ec)}
.custom{background:linear-gradient(135deg,#4b5ee7,#9138db,#e43b9d);position:relative}
.mapcard{background:linear-gradient(135deg,#207c58,#21b58b);position:relative;min-height:220px}
.mapcard img{width:100%;max-height:110px;object-fit:cover;border-radius:15px}
.mapcard h2{font-size:clamp(24px,4vw,42px)}
.screen{display:none}
.screen.active{display:block}
.back{background:linear-gradient(#f5222a,#a70007);border:0;border-radius:14px;color:white;font-weight:1000;padding:12px 22px;box-shadow:0 5px #5b0005;margin:10px 0 20px}
.scriptgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px}
.scriptgrid .card{min-height:185px;flex-direction:row;justify-content:center}
.wide{grid-column:1/-1;max-width:700px;width:100%;justify-self:center}
.toolbar{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(#ef1117,#a90008);border-radius:42px 42px 0 0;padding:16px;display:flex;gap:18px;justify-content:center;z-index:5}
.tool{background:#334bdd;border:0;border-radius:18px;color:white;padding:7px 16px;font-weight:1000}
.tool:nth-child(2){background:#740000}
.tool:nth-child(3){background:#c6d34e}
.tool b{display:block;font-size:42px}
.tool span{font-size:22px}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}
.modal.open{display:flex}
.box{background:#383838;border:3px solid #777;border-radius:28px;padding:22px;width:min(550px,100%);max-height:90vh;overflow:auto}
.box h2{text-align:center;font-size:50px;margin:0 0 18px}
.box label{display:block;font-weight:bold;margin:12px 0 5px}
.box input{width:100%;padding:14px;border:0;border-radius:13px;background:#171717;color:#fff}
.icons{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.icons button,.langs button{background:#171717;color:white;border:2px solid transparent;border-radius:10px;padding:9px;font-size:25px}
.icons button.sel,.langs button.sel{border-color:white;background:#405fe4}
.actions{display:flex;gap:8px;margin-top:16px}
.actions button{flex:1;border:0;border-radius:12px;padding:13px;font-weight:bold}
.save{background:#2875ff;color:white}
.cancel{background:#777;color:white}
.langs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.langs button{font-size:14px;text-align:left}
.viewer{position:fixed;inset:0;background:#05070c;display:none;flex-direction:column;z-index:30}
.viewer.open{display:flex}
.vbar{display:flex;gap:10px;align-items:center;background:#151b28;padding:10px}
.frame{border:0;flex:1;background:white}
.note{text-align:center;font-size:12px;background:#151b28;padding:9px;color:#c4ccda}
.remove{position:absolute;right:8px;top:8px;border:0;background:#e10c15;color:white;border-radius:10px;font-size:25px;display:none}
.deleting .remove{display:block}
@media(max-width:650px){.grid,.scriptgrid{gap:12px}
.card{min-height:190px;border-radius:22px;padding:12px}
.scriptgrid .card{min-height:145px;flex-direction:column}
.toolbar{gap:8px;padding:12px}
.tool{padding:5px 10px}
.tool b{font-size:34px}
.tool span{font-size:18px}
}
.vbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px;background:#090d18;border-bottom:1px solid #33415a}
.vbar b{flex:1;overflow-wrap:anywhere}
.viewer .frame{width:100%;min-height:60vh}
.back{cursor:pointer}
body{background:#240404}
 .card{border-radius:48px;min-height:204px}

 .title{font-size:calc(clamp(45px,9vw,100px)*0.84)}

/* Brawl Portal compact game-style redesign */
:root{color-scheme:dark;--bp-blue:#075cff;--bp-deep:#07165d;--bp-purple:#791dff;--bp-yellow:#ffd52e;--bp-ink:#07123c}
html{min-height:100%;background:#0648e9}
body{min-height:100vh;padding:10px 0 78px;color:#fff;font-family:Arial,Helvetica,sans-serif;background:radial-gradient(ellipse at 50% 38%,#25b8ff 0%,#0865f6 38%,#1229bb 76%,#11145e 100%);overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.13;background-image:radial-gradient(circle at 8% 20%,transparent 0 24px,#a9d8ff 25px 30px,transparent 31px),radial-gradient(circle at 91% 72%,transparent 0 28px,#b7ceff 29px 35px,transparent 36px);background-size:170px 150px,210px 180px;z-index:0}
.wrap{position:relative;z-index:1;width:min(100%,619px);margin:0 auto;padding:0 12px}
.title{font-size:clamp(29px,7vw,43px);line-height:1.05;text-align:center;letter-spacing:.3px;margin:3px 0 12px;font-weight:1000;color:#fff;text-shadow:0 3px 0 #17245b,0 5px 0 #060d32,-1px -1px 0 #07133e,1px -1px 0 #07133e;}
.title:after{content:"";display:block;height:4px;width:90px;margin:8px auto 0;border-radius:8px;background:linear-gradient(90deg,#16dcff,#ffd52e,#a52cff);box-shadow:0 2px 0 #10205d}
.title span{color:var(--bp-yellow)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.card{position:relative;isolation:isolate;min-width:0;min-height:137px;border:2px solid #07123c;border-radius:19px;padding:12px 10px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;text-align:center;color:white;box-shadow:0 4px 0 #07123c, inset 0 2px 0 #ffffff62;overflow:hidden;transition:transform .12s,filter .12s}
.card:before{content:"";position:absolute;z-index:-1;inset:0 0 auto;height:42%;background:linear-gradient(#ffffff30,transparent);pointer-events:none}
.card:active{transform:translateY(3px);box-shadow:0 1px 0 #07123c;filter:brightness(1.08)}
.card h2{font-size:clamp(19px,4vw,27px);line-height:1.05;margin:0;font-weight:1000;text-shadow:0 2px 0 #10164b,1px 3px 0 #10164b;overflow-wrap:anywhere}
.card small{font-size:10px;font-weight:900;letter-spacing:.45px;line-height:1.2;color:#eaf5ff;text-shadow:0 1px 2px #10164b}
.icon{font-size:clamp(34px,7vw,52px);line-height:1.1;filter:drop-shadow(0 3px 0 #081341)}
.card.big-icon .icon{font-size:56px}
.scripts{background:linear-gradient(145deg,#10c9e9,#0759ed 68%,#1434ad)}
.magic{background:linear-gradient(145deg,#d53cff,#8b18f6 56%,#4b18b9)}
.maps{background:linear-gradient(145deg,#16d5c0,#087fda 58%,#1237a9)}
.official{background:linear-gradient(145deg,#ffdc3e,#ff9d16 58%,#f05b17)}
.tnt{background:linear-gradient(145deg,#ff5a54,#e52440 55%,#8b123c)}
.hebrew{background:linear-gradient(145deg,#ffcb38,#ff7d21 52%,#e93e83)}
.custom{background:linear-gradient(145deg,#18baff,#4e39f4 60%,#7c24da);position:relative}
.mapcard{background:linear-gradient(145deg,#14d8c0,#087fda 58%,#1439a8);position:relative;min-height:125px}
.mapcard img{width:100%;max-height:65px;object-fit:cover;border-radius:10px;border:1px solid #ffffff60}
.mapcard h2{font-size:clamp(17px,3.5vw,23px)}
#custom{margin-top:11px!important}
.screen{display:none}
.screen.active{display:block}
.back{background:linear-gradient(#1375ff,#1736b7);border:2px solid #08133d;border-radius:12px;color:white;font-weight:1000;padding:7px 13px;box-shadow:0 3px 0 #07123c;margin:4px 0 12px}
.scriptgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.scriptgrid .card{min-height:118px;flex-direction:column;justify-content:center}
.wide{grid-column:1/-1;max-width:none;width:100%;justify-self:stretch}
.toolbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,619px);background:linear-gradient(180deg,#102c94,#09164f);border:2px solid #07123c;border-bottom:0;border-radius:19px 19px 0 0;padding:7px 10px calc(7px + env(safe-area-inset-bottom));display:flex;gap:9px;justify-content:space-around;z-index:5;box-shadow:0 -3px 12px #06134b55}
.tool,.tool:nth-child(2),.tool:nth-child(3){flex:1;max-width:160px;background:linear-gradient(#1689ff,#0752d9);border:2px solid #07123c;border-radius:12px;color:white;padding:4px 8px;font-weight:1000;box-shadow:inset 0 1px 0 #ffffff66}
.tool:nth-child(2){background:linear-gradient(#f85c67,#c61e45)}
.tool:nth-child(3){background:linear-gradient(#ffd84b,#ed9e15)}
.tool b{display:inline;font-size:18px;margin-right:5px}
.tool span{font-size:12px}
.modal{z-index:20}
.box{background:linear-gradient(145deg,#142f94,#10154d);border:2px solid #61d8ff;border-radius:20px;box-shadow:0 8px 0 #060e37;padding:18px;width:min(520px,100%)}
.box h2{font-size:28px;text-shadow:0 2px #07123c}
.box input{background:#071641;border:1px solid #3d8fff;border-radius:10px}
.icons button,.langs button{background:#091844;border:1px solid #2d65d2}
.icons button.sel,.langs button.sel{border-color:#ffdc3e;background:#194fbd}
.viewer{background:#050b25}
.vbar{background:linear-gradient(90deg,#102c94,#09164f);border-bottom:2px solid #29c8ff;padding:7px;gap:7px}
.vbar .back{margin:0;font-size:12px;padding:7px 9px}
.vbar b{font-size:13px}
.viewer .frame{min-height:0;flex:1}
.note{display:none}
@media(max-width:420px){body{padding-top:8px}
.wrap{padding:0 9px}
.title{font-size:30px;margin-bottom:10px}
.grid{gap:9px}
.card{min-height:123px;border-radius:16px;padding:9px 7px}
.card h2{font-size:19px}
.card small{font-size:9px}
.icon{font-size:36px}
.toolbar{gap:6px;padding-left:7px;padding-right:7px}
.tool b{font-size:17px}
.tool span{font-size:11px}
}
@media(min-width:500px) and (max-height:500px){body{padding-top:5px;padding-bottom:64px}
.title{font-size:29px;margin:0 0 7px}
.title:after{margin-top:5px;height:3px}
.grid{gap:8px}
.card{min-height:100px;padding:7px}
.icon{font-size:31px}
.card h2{font-size:19px}
.card small{font-size:9px}
#custom{margin-top:8px!important}
.toolbar{padding:5px 10px}
.tool b{font-size:16px}
.tool span{font-size:11px}
}

/* Responsive bottom controls: keep all three buttons inside the game webview in every language */
.toolbar{direction:ltr;left:0;right:0;transform:none;width:100%;max-width:619px;margin:0 auto;gap:6px;padding:6px 8px calc(6px + env(safe-area-inset-bottom));}
.tool,.tool:nth-child(2),.tool:nth-child(3){direction:rtl;flex:1 1 0;min-width:0;width:0;max-width:none;padding:4px 3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;overflow:hidden;}
.tool b{font-size:clamp(17px,4.2vw,25px);line-height:1.05;margin:0;}
.tool span{font-size:clamp(10px,2.7vw,14px);line-height:1.15;white-space:normal;overflow-wrap:anywhere;text-align:center;max-width:100%;}
/* Brawl Stars background art from Supercell's official site, darkened so controls remain readable */
html{background:#0648e9}
body{background:linear-gradient(180deg,rgba(4,24,100,.60),rgba(3,10,48,.82)),url("https://cdn.supercell.com/supercell.com/210304105450/supercell.com/files/styles/hero_image_large/public/hero_bg_brawlstars_.jpg?itok=-PxbQKHY&timestamp=1544532809") center center / cover fixed no-repeat,radial-gradient(ellipse at 50% 38%,#25b8ff 0%,#0865f6 38%,#1229bb 76%,#11145e 100%);}
body:before{opacity:.08}
@media(max-width:420px){.toolbar{gap:4px;padding-left:5px;padding-right:5px}
.tool,.tool:nth-child(2),.tool:nth-child(3){padding:4px 2px}
.tool b{font-size:18px}
.tool span{font-size:10px;letter-spacing:0}
}
@media(min-width:500px) and (max-height:500px){.toolbar{padding:4px 8px}
.tool b{font-size:16px}
.tool span{font-size:10px}
}

/* UI refresh v3 — screenshot-matched compact 619×401 portal */
html,body{width:100%;min-height:100%;margin:0}
body{padding:0 0 8px!important;overflow-x:hidden;background:#160d37;color:#fff;font-family:Arial,Helvetica,sans-serif}
body:after{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at 12% 20%,#6424fa 0,transparent 32%),radial-gradient(ellipse at 80% 75%,#32106b 0,transparent 50%),linear-gradient(135deg,#100b29,#351044 55%,#130c2e)}
.wrap{width:100%;max-width:619px;margin:0 auto;padding:8px 8px 12px;z-index:1}
.hero{height:clamp(190px,55vw,226px);display:grid;grid-template-columns:minmax(0,1fr) 34%;gap:10px;margin-bottom:12px}
.welcome{position:relative;min-width:0;border:2px solid #fff;border-radius:28px 48px 28px 28px;overflow:hidden;display:flex;align-items:center;background:radial-gradient(ellipse at 72% 68%,#2cefff 0,#079bff 40%,#0751d5 72%,#0836a5 100%);box-shadow:0 4px 0 #080c43,inset 0 0 0 3px #ffffff30}
.welcome:before{content:"";position:absolute;inset:0;opacity:.14;background-image:radial-gradient(ellipse at 25% 20%,transparent 0 14px,#a8e9ff 15px 18px,transparent 19px),radial-gradient(ellipse at 75% 75%,transparent 0 15px,#a8e9ff 16px 19px,transparent 20px);background-size:85px 66px}
.welcome-copy{position:relative;z-index:2;padding:8px 0 8px 13px;width:66%}
.welcome h1{font-size:clamp(32px,7vw,49px);line-height:.92;letter-spacing:-1.5px;margin:0;font-weight:1000;color:#fff;text-shadow:3px 4px 0 #a20a10,-2px -2px 0 #a20a10,2px -2px 0 #a20a10,-2px 2px 0 #a20a10,0 5px 0 #151345}
.welcome h1 b{font-size:1.08em}
.spike{position:absolute;right:-4px;bottom:-16px;font-size:clamp(90px,19vw,145px);line-height:1.1;filter:drop-shadow(0 5px 0 #1c2776);transform:rotate(-8deg);z-index:1}
.tools-panel{min-width:0;border:2px solid #0072ff;border-radius:35px 35px 12px 35px;background:#087cff;padding:8px;display:flex;flex-direction:column;gap:7px;box-shadow:0 4px 0 #06265e}
.tools-panel h2{font-size:clamp(25px,6.8vw,43px);line-height:1;margin:0 0 3px;text-align:center;font-weight:1000;color:#fff;-webkit-text-stroke:1px #07122c;text-shadow:2px 3px #07122c}
.tools-panel button{border:0;border-radius:16px;min-height:0;flex:1;font-weight:1000;font-size:clamp(18px,4.8vw,34px);color:white;text-shadow:0 2px 0 #0002;box-shadow:inset 0 3px #ffffff38,0 3px 0 #07123c;line-height:1.05;padding:4px 3px}
.tool-add{background:linear-gradient(135deg,#3ff000,#21b900)}
.tool-remove{background:linear-gradient(135deg,#ff2028,#d90018)}
.tool-language{background:linear-gradient(135deg,#292e35,#59645d);border:2px solid #a4e5b3!important}
.section-label{display:none}
.grid,#custom,.scriptgrid{display:flex;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;gap:9px;padding:0 2px 7px;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.grid::-webkit-scrollbar,#custom::-webkit-scrollbar,.scriptgrid::-webkit-scrollbar{display:none}
.card,.grid .card,#custom .card,.scriptgrid .card{flex:0 0 54%;width:54%;min-width:0;min-height:138px;height:138px;max-height:138px;display:flex;flex-direction:row;align-items:stretch;justify-content:space-between;padding:0;border:2px solid #fff;border-radius:26px;gap:0;overflow:hidden;text-align:left;scroll-snap-align:start;box-shadow:0 3px 0 #090b30,inset 0 2px #ffffff50}
.card .tile-icon{width:42%;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#3d3d3d;font-size:clamp(42px,10vw,67px);text-shadow:0 3px #111;filter:drop-shadow(0 2px #111)}
.tile-copy{flex:1;min-width:0;background:#363636;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:6px 5px;text-align:center}
.card h2{font-size:clamp(19px,4.8vw,31px);line-height:.98;margin:0 0 7px;text-transform:none;text-shadow:none;font-weight:1000;overflow-wrap:anywhere}
.card small{font-size:clamp(11px,2.5vw,16px);line-height:1.35;letter-spacing:0;color:#bcbcbc;text-shadow:none;font-weight:900;overflow-wrap:anywhere}
.scripts{background:#393939}
.scripts .tile-icon{background:#414141}
.maps{background:#393939}
.maps .tile-icon{background:#414141}
.magic,.official,.custom,.hebrew,.tnt{background:#393939}
.magic .tile-icon,.official .tile-icon,.custom .tile-icon,.hebrew .tile-icon,.tnt .tile-icon{background:#414141}
.custom{position:relative}
.custom h2{font-size:clamp(17px,4vw,27px)}
.custom .icon{width:42%;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#414141;font-size:clamp(42px,10vw,67px)}
.custom small{padding:0 2px}
.remove{right:5px;top:5px;z-index:5;font-size:18px!important;background:#e10c15!important;border-radius:8px!important;padding:2px 6px!important}
.toolbar{display:none!important}
#custom{margin-top:8px!important}
.title{display:none}
.back{font-size:13px;padding:8px 12px;margin:3px 0 8px;border-radius:13px;background:linear-gradient(#087cff,#0751d5);border:2px solid #fff;box-shadow:0 3px #07123c}
.scriptgrid .card{min-height:138px;height:138px;flex-direction:row}
.wide{max-width:none;width:54%;justify-self:auto}
.screen.active{display:block}
.screen:not(#lobby) .title{display:block;font-size:27px;margin:2px 0 8px}
.screen:not(#lobby) .scriptgrid{margin-top:4px}
.mapcard{flex:0 0 54%;height:138px;min-height:138px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px;background:#363636}
.mapcard img{width:55%;max-height:55px}
.mapcard h2{font-size:19px}
.mapcard p{font-size:11px;margin:3px}
.mapcard button{background:linear-gradient(#3ff000,#21b900);color:white;border:2px solid white;box-shadow:0 3px #07123c;border-radius:10px;padding:6px 12px!important}
.modal{z-index:20;background:#07091dcc;backdrop-filter:blur(4px)}
.box{background:#087cff;border:3px solid #fff;border-radius:24px;box-shadow:0 5px #07123c;padding:16px}
.box h2{font-size:27px;text-shadow:0 2px #07123c}
.box input{background:#f7fbff;color:#111;border:2px solid #0751d5}
.icons button,.langs button{border:2px solid #fff;border-radius:12px;background:#0751d5}
.icons button.sel,.langs button.sel{background:#3ce900;border-color:#fff}
.actions button,.save{border:2px solid #fff!important;border-radius:13px!important;box-shadow:0 3px #07123c;font-weight:1000}
.save{background:linear-gradient(#3ff000,#21b900)!important;color:#fff}
.cancel{background:linear-gradient(#ff4545,#cf001b);color:#fff}
.viewer{z-index:30;background:#07091d}
.vbar{background:#087cff;border-bottom:2px solid #fff}
.vbar .back{background:#d90b20}
.note{background:#111b4c}
@media(max-width:420px){.wrap{padding:6px}
.hero{height:clamp(172px,53vw,205px);gap:7px;margin-bottom:10px}
.welcome{border-radius:22px 34px 22px 22px}
.welcome-copy{padding-left:9px;width:68%}
.welcome h1{font-size:clamp(29px,7.5vw,39px)}
.spike{font-size:clamp(78px,20vw,105px);right:-8px}
.tools-panel{padding:6px;gap:5px;border-radius:25px 25px 10px 25px}
.tools-panel h2{font-size:clamp(24px,7vw,31px)}
.tools-panel button{font-size:clamp(17px,5vw,23px);border-radius:12px}
.grid,#custom,.scriptgrid{gap:7px}
.card,.grid .card,#custom .card,.scriptgrid .card{flex-basis:72%;width:72%;height:126px;min-height:126px;max-height:126px;border-radius:20px}
.card .tile-icon,.custom .icon{font-size:48px;width:40%}
.card h2{font-size:22px}
.card small{font-size:12px}
.custom h2{font-size:19px}
}
@media(min-width:500px) and (max-height:500px){.wrap{padding-top:5px}
.hero{height:205px}
.card,.grid .card,#custom .card,.scriptgrid .card{height:128px;min-height:128px;max-height:128px}
.tools-panel h2{font-size:35px}
}

/* Landscape cards: fix blank-looking map/script tiles and allow horizontal swiping */
#scripts .scriptgrid,#maplist{display:flex!important;flex-flow:row nowrap!important;gap:12px!important;width:100%;max-width:100%;overflow-x:auto!important;overflow-y:hidden;padding:3px 3px 10px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:#55dfff #10215c}
#scripts .scriptgrid .card,#maplist .mapcard{flex:0 0 min(78vw,470px)!important;width:min(78vw,470px)!important;max-width:none!important;min-width:0;height:205px!important;min-height:205px!important;max-height:205px;scroll-snap-align:start;border:3px solid #f4f8ff!important;border-radius:25px!important;background:linear-gradient(180deg,#484848,#303030 78%)!important;box-shadow:0 5px 0 #07123c,inset 0 2px 0 #ffffff70!important;overflow:hidden;position:relative;padding:8px 10px!important;color:#fff}
#scripts .scriptgrid .card{flex-direction:row!important;align-items:flex-start!important;justify-content:flex-start!important;gap:8px;text-align:left!important}
#scripts .scriptgrid .card h2{font-size:clamp(22px,5.5vw,38px)!important;line-height:1.02;text-align:left;overflow-wrap:anywhere;max-width:78%}
#scripts .scriptgrid .card .tile-icon{margin-left:auto;flex:0 0 auto;font-size:clamp(38px,8vw,60px);line-height:1}
#scripts .scriptgrid .card small{display:block;font-size:13px;line-height:1.2}
#scripts .scriptgrid .wide{grid-column:auto!important;justify-self:auto!important}
#maplist .mapcard{display:flex!important;flex-direction:row!important;align-items:stretch!important;justify-content:flex-start!important;gap:8px;text-align:left!important}
#maplist .mapcard img,#maplist .mapcard>.icon{flex:0 0 76px;width:76px;max-width:76px;height:100%;max-height:100%;object-fit:cover;border-radius:14px;align-self:stretch}
#maplist .mapcard>.icon{display:flex;align-items:center;justify-content:center;font-size:48px}
#maplist .mapcard h2{flex:1 1 auto;min-width:0;font-size:clamp(20px,5vw,34px)!important;line-height:1.05;align-self:flex-start;overflow-wrap:anywhere}
#maplist .mapcard p{position:absolute;left:95px;top:43px;right:112px;margin:0;font-size:clamp(12px,3vw,16px);line-height:1.2;color:#fff}

function card(thumb,name,desc,btn,fn,extra){
 const d=document.createElement('div');d.className='card pcard '+(extra||'');
 const top=document.createElement('div');top.className='ptop';
 const th=document.createElement('div');th.className='pthumb';
 if(/^data:|^http|\.(jpe?g|png|webp)$/.test(thumb)){const i=document.createElement('img');i.src=thumb;i.alt='';th.appendChild(i)}else th.textContent=thumb;
 const tx=document.createElement('div');tx.className='ptxt';
 const h=document.createElement('h2');h.textContent=name;tx.appendChild(h);
 if(desc){const p=document.createElement('p');p.textContent=desc;tx.appendChild(p)}
 top.append(th,tx);
 const b=document.createElement('button');b.type='button';b.className='pbtn';b.textContent=btn;b.onclick=fn;
 d.append(top,b);return d;
}
renderMaps=function(){
 const c=document.getElementById('maplist');if(!c)return;c.innerHTML='';
 maps.forEach(m=>{
  const he=lang==='he';
  c.appendChild(card(m.image||'🗺️',he&&m.nameHe?m.nameHe:m.name,he&&m.descHe?m.descHe:m.description,t('play'),()=>{if(m.url)openSite(m.url,m.name)}));
 });
};
renderExtraScripts=function(){
 const root=document.querySelector('#scripts .scriptgrid');if(!root)return;
 root.innerHTML='';
 const all=card('🏆',t('all'),t('allD'),t('open'),()=>openSite('https://scripting.donutquine.dev/@Maorpro','All Scripts'),'wide');
 root.appendChild(all);
 (window.PORTAL_SCRIPTS||[]).filter(s=>!s.hidden).forEach(s=>{
  root.appendChild(card(s.icon||'📜',s.name,s.description||(t('sd')+s.name),t('open'),()=>{const u=String(s.url||'').trim();if(u)openSite(u,s.name)}));
 });
};
const _sl=setLang;setLang=function(x){_sl(x);renderMaps();renderExtraScripts()};
renderMaps();renderExtraScripts();
})();
